[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-agent"
version = "0.1.0"
description = "车载三路决策 Agent（Task/RAG/Chat）"
requires-python = ">=3.10"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# 从仓库根目录扫描包
where = ["."]
# 只纳入项目核心目录，避免把无关目录打进包
include = ["main*", "task*", "kb*"]
# 允许没有 __init__.py 的命名空间包（当前项目结构需要）
namespaces = true
